apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ldnf-payroll-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: payroll-worker@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/ldnf/payroll-worker:latest
          env:
            - name: PAYROLL_EXPORT_DIR
              value: /data/exports
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ldnf-database-url
                  key: latest
