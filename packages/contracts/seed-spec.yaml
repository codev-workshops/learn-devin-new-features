# Harbourline seed-data specification (frozen in W0).
# db/seed (W1-api) must generate exactly this dataset, deterministically, from `seed: 20261022`.
# `npm run db:seed -- --reset` drops and re-creates it; it is the universal lab reset.
version: 1
seed: 20261022
as_of: "2026-10-22T00:00:00Z" # every relative age below is measured from this instant

brands:
  lumen-home:
    name: Lumen Home
    currency: USD
    pricing: tax_exclusive # 8.25% sales tax added at checkout
    tax_rate: 0.0825
    locale: en-US
    warehouses: [US-NJ]
    free_shipping_over: null
    shipping_flat: "7.95"
    order_number_prefix: LH
    sku_count: 30
    collections:
      - {
          slug: lamp-week,
          name: Lamp Week,
          promotion: lamp-week-2026,
          description: "Flash sale, 20% off lamps; three SKUs deliberately low on stock",
        }
      - { slug: living, name: Living }
      - { slug: kitchen, name: Kitchen }
      - { slug: bundles, name: Bundles }
  trailhead-supply:
    name: Trailhead Supply
    currency: EUR
    pricing: tax_inclusive # 19% VAT included in every list price
    tax_rate: 0.19
    locale: en-IE
    warehouses: [DE-HAM, NL-RTM]
    free_shipping_over: "80.00"
    shipping_flat: "5.90"
    order_number_prefix: TS
    sku_count: 30
    collections:
      - { slug: shelter, name: Shelter }
      - { slug: apparel, name: Apparel }
      - { slug: trail, name: Trail }
      - { slug: pre-order, name: Pre-order, description: "Zero on-hand, ships next season" }

# Base price lists: id = <brand>-base. Promotions reference the same SKUs with a lower price.
price_lists:
  - { id: lumen-home-base, brand: lumen-home, name: Base USD }
  - id: lamp-week-2026
    brand: lumen-home
    name: Lamp Week 2026
    active_from: "2026-10-20T00:00:00Z"
    active_to: "2026-10-27T00:00:00Z"
    rule: 20% off every SKU in collection lamp-week, rounded half-up to the cent
  - { id: trailhead-supply-base, brand: trailhead-supply, name: Base EUR (VAT inclusive) }

