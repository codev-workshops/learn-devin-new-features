users:
  merchandisers:
    - { email: maya@lumenhome.test, brand: lumen-home, role: merchandiser, name: Maya Perera }
    - { email: dev@lumenhome.test, brand: lumen-home, role: merchandiser, name: Dev Okafor }
    - {
        email: lena@trailheadsupply.test,
        brand: trailhead-supply,
        role: merchandiser,
        name: Lena Vogel,
      }
  admins:
    - { email: ops@harbourline.test, brand: null, role: admin, name: Platform Ops }
  customers:
    rule: 120 deterministic customers per brand, `customer-<nnn>@<brand>.test`; no real names or addresses

orders:
  total: 400
  split: { lumen-home: 220, trailhead-supply: 180 }
  window: last 180 days before as_of
  lines_per_order: 1-4, SKUs weighted towards the brand's two cheapest collections
  status_mix:
    delivered: 0.78
    shipped: 0.06
    packed: 0.03
    confirmed: 0.03
    paid: 0.01
    pending_payment: 0.02
    refunded: 0.05 # 5% refunded (payment.refunded webhook recorded)
    chargeback: 0.02 # 2% chargebacks (chargeback.opened webhook recorded)
  every_order_has:
    [reservation_made event, payment_received or payment_failed event, email_queued outbox row]

carts:
  total: 30
  split: { lumen-home: 16, trailhead-supply: 14 }
  ages: 1 hour to 9 days, spread evenly on a log scale
  with_pending_payment: 6 # a checkout opened a PayGate session that never resolved; 4 of them are older than 48 h
  lines_per_cart: 1-3

pending_webhooks: # rows in the webhook inbox awaiting the fulfilment worker
  total: 12
  mix:
    - { count: 6, type: payment.succeeded, note: fresh, one per pending_payment order }
    - {
        count: 3,
        type: payment.succeeded,
        note: exact duplicates (same event_id) of three delivered orders,
      }
    - {
        count: 2,
        type: payment.succeeded,
        note: late — their carts are among the >48 h pending carts the sweeper will delete,
      }
    - { count: 1, type: payment.failed, note: for a Trailhead pre-order }

# Edge cases planted by W1 children. Never fixed on main; remediation happens on throwaway leaves.
planted_edge_cases:
  - {
      id: oversell,
      owner: W1-api,
      where: "services/api reservation (read-then-write, no SELECT … FOR UPDATE)",
      symptom: "scenarios/oversell.sh fires 20 concurrent checkouts on LH-LAMP-03 (3 units); ~7 succeed; on_hand goes negative",
      labs: [5, 9, 12, 15],
    }
  - {
      id: duplicate-webhook,
      owner: W1-worker,
      where: "fulfilment-worker ignores event_id",
      symptom: "same payment.succeeded twice → order confirmed twice, stock decremented twice, two emails in the outbox",
      labs: [7, 12, 15],
    }
  - {
      id: currency-rounding,
      owner: W1-api + W1-worker,
      where: "API totals use JS floats and half-up; worker recomputes with Decimal and banker's rounding; VAT-inclusive EUR lines",
      symptom: "1-cent drift on ≈3% of Trailhead orders; reconciliation never balances",
      labs: [5, 6, 9],
    }
  - {
      id: abandoned-cart-sweeper,
      owner: W1-worker,
      where: "sweeper deletes carts older than 48 h even with a pending payment",
      symptom: "late webhook for a deleted cart → ghost order with no lines",
      labs: [7, 12, 15],
    }
  - {
      id: cross-brand-leak,
      owner: W1-api,
      where: "GET /orders/{orderId} checks existence but not the caller's brand",
      symptom: "Lumen merchandiser can read Trailhead orders by id",
      labs: [5, 9],
    }
  - {
      id: unverified-signature,
      owner: W1-api,
      where: "POST /webhooks/payments reads X-PayGate-Signature but never compares it",
      symptom: "anyone can POST a webhook",
      labs: [5, 6],
    }
  - {
      id: n-plus-one,
      owner: W1-api,
      where: "GET /catalog/collections/{slug} loads variants per product",
      symptom: "≈60 queries per Lamp Week page view",
      labs: [5],
    }
  - {
      id: admin-a11y,
      owner: W1-web,
      where: "/admin icon buttons without labels; 3.1:1 contrast on price badges",
      symptom: "accessibility scan findings",
      labs: [5],
    }
  - {
      id: price-drift,
      owner: W1-api,
      where: "checkout trusts CartLine.unitPrice captured hours earlier",
      symptom: "flash-sale price change not reflected at checkout",
      labs: [6, 15],
    }
  - {
      id: bad-migration,
      owner: W1-fixtures,
      where: "scenarios/bad-migration.patch drops the NOT NULL default on orders.currency",
      symptom: "worker crashes on new orders after deploy",
      labs: [2, 12],
    }
