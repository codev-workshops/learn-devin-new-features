# Repo blueprint for codev-workshops/learn-devin-new-features (Kadé Commerce).
# Mirrors what is applied in Devin's environment settings (schema: https://docs.devin.ai/onboard-devin/environment-yaml).
# Keep this file and the settings in sync. No secrets here. Every step is idempotent.
# History: W0-A drafted the first version; W0-B applied it (22 Oct 2026) after verifying each
# command on a session VM, dropping the stale payroll-worker steps and unverified docker pulls.
# W1-api (22 Oct 2026) added `cp -n .env.example .env` (DATABASE_URL for db:migrate/db:seed).
# W2-12 (22 Oct 2026) applied it to the settings blueprint and added the fulfilment-worker pip install
# (pytest/ruff for the worker gates); `npm test` also needs `npm run build` (contracts dist) and `npm run db:up` first.
# W1-fixtures (22 Oct 2026) added shellcheck/jq (scenarios/ injectors) and the fixtures-gates knowledge entry.
initialize: |
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
  nvm install 22 >/dev/null && nvm alias default 22 >/dev/null
  cp -n .env.example .env || true
  sudo apt-get install -y -q shellcheck jq >/dev/null
maintenance: |
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use 22 >/dev/null
  npm install --no-audit --no-fund
  pip install -q -e "services/fulfilment-worker[dev]"
knowledge:
  - name: test
    contents: |
      npm test   (labs Vitest suite + packages/contracts via scripts/ws.mjs)
  - name: lint
    contents: |
      npm run lint   (prettier --check, eslint, per-workspace lint; labs lint = node labs/build.mjs --check)
  - name: build
    contents: |
      npm run build && npm run labs:build
  - name: gates
    contents: |
      npm run gates   (test, lint, build, labs:build) && npm run coach:dryrun -- 00
  - name: startup
    contents: |
      npm run db:up (Compose Postgres 16 from mirror.gcr.io) && npm run db:migrate && npm run db:seed (no-op once seeded; `npm run db:seed -- --reset` is the lab reset and rebuilds the dataset). DATABASE_URL comes from the process env, else the root .env created by initialize, else the local default. API: npm run dev -w services/api (3001); KADE_NOW=2026-10-22T09:00:00Z pins the clock. Lab pages: npm run labs:build, then open labs/index.html from file://.
  - name: fixtures-gates
    contents: |
      node --test 'scenarios/test/*.test.mjs' 'fixtures/mcp/test/*.test.mjs' && shellcheck -x scenarios/*.sh scenarios/lib/common.sh   (W1-fixtures; not part of npm test)
  - name: notes
    contents: |
      Node 22 via nvm (root engines ">=22 <23"); gates also pass on Node 20/24. Python deps for services/fulfilment-worker come from maintenance (pip install -e "services/fulfilment-worker[dev]"). On a fresh VM run npm run build and npm run db:up before npm run gates (services/api tests import the built contracts and need Postgres).
