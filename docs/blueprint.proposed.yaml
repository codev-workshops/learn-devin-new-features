# Repo blueprint for codev-workshops/learn-devin-new-features (Harbourline).
# Mirrors what is applied in Devin's environment settings (schema: https://docs.devin.ai/onboard-devin/environment-yaml).
# Keep this file and the settings in sync. No secrets here. Every step is idempotent.
# History: W0-A drafted the first version; W0-B applied it (22 Oct 2026) after verifying each
# command on a session VM, dropping the stale payroll-worker steps and unverified docker pulls.
# W1-api (22 Oct 2026) added `cp -n .env.example .env` (DATABASE_URL for db:migrate/db:seed).
# W2-12 (22 Oct 2026) applied it to the settings blueprint and added the fulfilment-worker pip install
# (pytest/ruff for the worker gates); `npm test` also needs `npm run build` (contracts dist) and `npm run db:up` first.
# W1-fixtures (22 Oct 2026) added shellcheck/jq (scenarios/ injectors) and the fixtures-gates knowledge entry.
# W1-mobile (22 Oct 2026) added the Android SDK/emulator step for apps/mobile; details in blueprint.proposed.mobile.yaml.
# W1-web (22 Oct 2026) added the Playwright Chromium install for the apps/web smoke tests (`npm run test:e2e -w apps/web`).
# W4-13 (22 Oct 2026) applied the Linux block plus a second `runs-on: macos` block (iOS Simulator + harbourline-haptics),
# every macOS command verified by the W4-13 macOS child (Xcode 26.6, iPhone 17 / iOS 26.5).
# rename (22 Oct 2026): platform renamed to Harbourline (`@harbourline/*`, `HARBOURLINE_*`, `harbourline` db user/name, `harbourline_android` AVD).
initialize: |
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
  nvm install 22 >/dev/null && nvm alias default 22 >/dev/null
  cp -n .env.example .env || true
  sudo apt-get install -y -q shellcheck jq >/dev/null
  # Android SDK for apps/mobile (expo export / expo run:android on a headless KVM emulator)
  export ANDROID_HOME="$HOME/android-sdk"
  mkdir -p "$ANDROID_HOME/cmdline-tools"
  if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
    curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
    mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
  fi
  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
  echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n harbourline_android -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force >/dev/null
  grep -q '^ANDROID_HOME=' "$ENVRC" 2>/dev/null || { echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_SDK_ROOT=$ANDROID_HOME"; } >> "$ENVRC"
  sudo ln -sf "$ANDROID_HOME/platform-tools/adb" /usr/local/bin/adb
maintenance: |
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use 22 >/dev/null
  npm install --no-audit --no-fund
  pip install -q -e "services/fulfilment-worker[dev]"
  npm run test:e2e:install -w apps/web
knowledge:
  - name: test
    contents: |
      npm test   (labs Vitest suite + packages/contracts via scripts/ws.mjs)
  - name: lint
    contents: |
      npm run lint   (prettier --check, eslint, per-workspace lint; labs lint = node labs/build.mjs --check)
  - name: build
    contents: |
      npm run build && npm run labs:build
  - name: gates
    contents: |
      npm run gates   (test, lint, build, labs:build) && npm run coach:dryrun -- 00
  - name: coach-calibration
    contents: |
      node labs/coach-dryrun/calibrate.mjs --strict (all 15 coaches on the generic transcript, spread <= 15; --write regenerates labs/COACH-CALIBRATION.md). Progress lives on branch `coaching` (never merged): git fetch origin coaching && git show origin/coaching:coaching/aggregate.mjs > /tmp/aggregate.mjs && node /tmp/aggregate.mjs --ref origin/coaching [--previous <handle> <nn>]
  - name: startup
    contents: |
      npm run db:up (Compose Postgres 16 from mirror.gcr.io) && npm run db:migrate && npm run db:seed (no-op once seeded; `npm run db:seed -- --reset` is the lab reset and rebuilds the dataset). DATABASE_URL comes from the process env, else the root .env created by initialize, else the local default. Run npm run build first on a fresh VM (seed, tests and lab:reset import the built @harbourline/contracts). API: npm run dev -w services/api (3001); HARBOURLINE_NOW=2026-10-22T09:00:00Z pins the clock. Webhook/sweeper injectors also need the worker: (cd services/fulfilment-worker && DATABASE_URL=postgres://harbourline:harbourline@localhost:5432/harbourline python3 -m fulfilment_worker run). Lab pages: npm run labs:build, then open labs/index.html from file://.
  - name: fixtures-gates
    contents: |
      node --test 'scenarios/test/*.test.mjs' 'fixtures/mcp/test/*.test.mjs' && shellcheck -x scenarios/*.sh scenarios/lib/common.sh   (W1-fixtures; not part of npm test)
  - name: notes
    contents: |
      Node 22 via nvm (root engines ">=22 <23"); gates also pass on Node 20/24. Python deps for services/fulfilment-worker come from maintenance (pip install -e "services/fulfilment-worker[dev]"). On a fresh VM run npm run build and npm run db:up before npm run gates (services/api tests import the built contracts and need Postgres).
  - name: mobile
    contents: |
      apps/mobile gates: npm test/lint/build --workspace @harbourline/mobile (build = fixture --check + expo export android). Emulator: $ANDROID_HOME/emulator/emulator -avd harbourline_android -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -accel on & then (cd apps/mobile && npx expo run:android). Default API mode is in-process mock; EXPO_PUBLIC_API_MODE=live talks to services/api at http://10.0.2.2:3001 from the emulator.
---
# macOS block (W4-13): Node 22, CocoaPods, expo prebuild for iOS and pod install. Xcode comes with the image.
runs-on: macos
initialize: |
  brew list node@22 >/dev/null 2>&1 || brew install node@22
  echo "PATH=/opt/homebrew/opt/node@22/bin:$PATH" >> $ENVRC
  echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $ENVRC
  echo "LANG=en_US.UTF-8" >> $ENVRC
  command -v pod >/dev/null || brew install cocoapods
maintenance: |
  export PATH="/opt/homebrew/opt/node@22/bin:$PATH" LANG=en_US.UTF-8
  npm install --no-audit --no-fund
  (cd apps/mobile && npx expo prebuild --platform ios --no-install && cd ios && pod install)
knowledge:
  - name: ios
    contents: |
      iOS Simulator build (macOS only): (cd apps/mobile && xcodebuild -workspace ios/Harbourline.xcworkspace -scheme Harbourline -sdk iphonesimulator -configuration Release -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' -derivedDataPath ios/build build) then xcrun simctl install booted ios/build/Build/Products/Release-iphonesimulator/Harbourline.app && xcrun simctl launch booted test.harbourline.commerce. grep HarbourlineHaptics apps/mobile/ios/Podfile.lock proves the Swift module is linked. Gates: npm test/lint/build --workspace apps/mobile.
