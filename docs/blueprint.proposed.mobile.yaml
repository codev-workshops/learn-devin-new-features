# Proposed multi-platform blueprint fragment for apps/mobile (W1-mobile).
# Applied to the repo blueprint by W1-mobile on 22 Oct 2026 (user pre-approved blueprint updates);
# docs/blueprint.proposed.yaml mirrors the Linux Android step. Two YAML documents, one per `runs-on`, as required for multi-platform
# blueprints. The Linux document is what W1-mobile exercised; the macOS document is the
# recipe for the W4-13 iOS child and is marked "not exercised" until that child runs it.
runs-on: linux
repos:
  - repo: codev-workshops/learn-devin-new-features
    exec_dir: /home/ubuntu/repos/learn-devin-new-features
    initialize:
      - name: Node 22 via nvm
        run: |
          export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
          nvm install 22 >/dev/null && nvm alias default 22 >/dev/null
      - name: Android SDK (command-line tools, platforms 35/36, emulator, API 35 system image)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0" \
            "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n kade_android -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          grep -q 'android-sdk/platform-tools' "$HOME/.bashrc" 2>/dev/null || {
            echo 'export ANDROID_HOME="$HOME/android-sdk"'
            echo 'export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"'
          } >> "$HOME/.bashrc"
    install_dependencies:
      - name: npm workspaces
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
    maintain:
      - name: Refresh npm workspaces
        run: npm install --no-audit --no-fund
    startup:
      - name: Headless Android emulator (KVM)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          nohup "$ANDROID_HOME/emulator/emulator" -avd kade_android -no-window \
            -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -accel on \
            >/tmp/emulator.log 2>&1 &
    test:
      - run: npm test --workspace apps/mobile
    lint:
      - run: npm run lint --workspace apps/mobile
    build:
      - run: npm run build --workspace apps/mobile
---
# macOS document: iOS toolchain for the optional modules/kade-haptics Swift module.
# NOT EXERCISED by W1-mobile (Linux only). Owned by the W4-13 iOS child.
runs-on: macos
repos:
  - repo: codev-workshops/learn-devin-new-features
    exec_dir: /Users/devin/repos/learn-devin-new-features
    initialize:
      - name: Node 22 via nvm
        run: |
          export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"
          nvm install 22 >/dev/null && nvm alias default 22 >/dev/null
      - name: Xcode command-line tools, CocoaPods, iOS simulator runtime
        run: |
          xcode-select -p >/dev/null 2>&1 || xcode-select --install || true
          sudo gem install cocoapods --no-document || brew install cocoapods
          xcodebuild -downloadPlatform iOS || true
    install_dependencies:
      - name: npm workspaces
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Prebuild iOS project (Continuous Native Generation) and install pods
        run: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
    maintain:
      - name: Refresh npm workspaces
        run: npm install --no-audit --no-fund
    test:
      - run: npm test --workspace apps/mobile
    lint:
      - run: npm run lint --workspace apps/mobile
    build:
      - name: Compile the Swift haptics module into a simulator build
        run: |
          cd apps/mobile
          npx expo run:ios --no-bundler --configuration Debug \
            --device "iPhone 16" || xcodebuild -workspace ios/KadCommerce.xcworkspace \
            -scheme KadCommerce -sdk iphonesimulator -configuration Debug build
