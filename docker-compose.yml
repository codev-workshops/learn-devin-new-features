# Local infrastructure for Harbourline.
#
# Owned by W0-A (this file) and W1-api (adds the `api` service). Every other
# service lives in docker-compose.services.yml (overlay, owned by W1-worker):
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
#
# The image is pulled from mirror.gcr.io because Docker Hub rate-limits
# anonymous pulls from Devin VMs.
name: harbourline

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: harbourline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harbourline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harbourline}
      POSTGRES_DB: ${POSTGRES_DB:-harbourline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - harbourline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harbourline} -d ${POSTGRES_DB:-harbourline}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Order API (W1-api). Local development usually runs `npm run dev -w services/api` against the
  # postgres service instead; this service exists for the deploy/rollback and incident labs.
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-harbourline}:${POSTGRES_PASSWORD:-harbourline}@postgres:5432/${POSTGRES_DB:-harbourline}
      API_PORT: "3001"
      PAYGATE_SECRET: ${PAYGATE_SECRET:-harbourline-local-paygate-secret}
      PAYGATE_URL: ${PAYGATE_URL:-http://localhost:3002}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["api"]

volumes:
  harbourline-pgdata:
