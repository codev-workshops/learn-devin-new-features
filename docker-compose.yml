services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ldnf
      POSTGRES_PASSWORD: ldnf
      POSTGRES_DB: ldnf
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldnf -d ldnf"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://ldnf:ldnf@postgres:5432/ldnf
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      API_PORT: "3001"
      # Local training stack: ports bind to 127.0.0.1, so the passwordless demo login stays local.
      ALLOW_DEMO_LOGIN: "true"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  payroll-worker:
    build: ./services/payroll-worker
    environment:
      DATABASE_URL: postgres://ldnf:ldnf@postgres:5432/ldnf
      PAYROLL_EXPORT_DIR: /data/exports
    volumes:
      - exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  exports:
